## AGP 需要写 ~/.android。多数机器上这没问题。
## 但如果构建环境的 home 不可写（CI / 沙箱 / 受限容器），注意：
##   JVM 的 user.home 来自系统账户库，**不认 $HOME 环境变量** ——
##   这时要在这里显式指定一个可写目录：
##     org.gradle.jvmargs=-Xmx2048m -Duser.home=/path/to/writable/home
org.gradle.jvmargs=-Xmx2048m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=false
